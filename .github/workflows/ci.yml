name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Public repo: read-only by default; no cloud credentials — modules are only linted, never applied.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.15.4
  TFLINT_VERSION: v0.64.0
  CHECKOV_VERSION: 3.3.19
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # checkov SARIF → code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (modules + examples)
        run: |
          for d in $(find modules -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: checkov
        run: |
          pipx install "checkov==$CHECKOV_VERSION" >/dev/null
          checkov -d modules --framework terraform --compact --quiet \
            --output cli --output sarif --output-file-path console,checkov.sarif
      - name: drop suppressed findings
        if: always()
        # Justified skips are documented in code; code scanning ignores SARIF suppressions
        run: |
          [ -f checkov.sarif ] || exit 0
          jq '(.runs[].results) |= map(select((.suppressions // []) | length == 0))' checkov.sarif > filtered.sarif
          mv filtered.sarif checkov.sarif
      - name: upload checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: checkov.sarif
          category: checkov

  # Single required check for the ruleset
  ci-ok:
    name: ci-ok
    needs: [static]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.static.result }}" = "success" ]'
